name: Validate luna-subagents

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and verify with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-Throws {
            param(
              [Parameter(Mandatory)]
              [scriptblock]$Action,

              [Parameter(Mandatory)]
              [string]$ExpectedPattern,

              [Parameter(Mandatory)]
              [string]$FailureMessage
            )

            try {
              & $Action
              throw $FailureMessage
            }
            catch {
              if ($_.Exception.Message -eq $FailureMessage) {
                throw
              }
              if ($_.Exception.Message -notmatch $ExpectedPattern) {
                throw "Unexpected error. Expected '$ExpectedPattern', received: $($_.Exception.Message)"
              }
            }
          }

          $copilotHome = Join-Path $env:RUNNER_TEMP 'copilot-home'
          New-Item -ItemType Directory -Path $copilotHome -Force | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $copilotHome 'copilot-instructions.md'),
            "# Existing instructions`r`n`r`nKeep this line.`r`n",
            [Text.UTF8Encoding]::new($false)
          )

          $installer = Join-Path $PWD 'Skills\luna-subagents\scripts\install.ps1'
          $sourceSkill = Join-Path $PWD 'Skills\luna-subagents\SKILL.md'
          $installedSkillRoot = Join-Path $copilotHome 'skills\luna-subagents'
          $installedSkill = Join-Path $installedSkillRoot 'SKILL.md'
          $instructionsPath = Join-Path $copilotHome 'copilot-instructions.md'
          $agentPath = Join-Path $copilotHome 'agents\luna-subagents-executor.agent.md'

          $fallbackHome = Join-Path $env:RUNNER_TEMP 'fallback-home'
          $previousCopilotHome = $env:COPILOT_HOME
          $env:COPILOT_HOME = $fallbackHome
          try {
            Assert-Throws `
              -Action { & $installer -CopilotHome '' -WhatIf } `
              -ExpectedPattern 'must not be empty' `
              -FailureMessage 'Install unexpectedly accepted an explicitly empty Copilot home.'
          }
          finally {
            $env:COPILOT_HOME = $previousCopilotHome
          }
          if (Test-Path -LiteralPath $fallbackHome) {
            throw 'An explicitly empty Copilot home fell back to COPILOT_HOME.'
          }

          $sourceSkillRoot = Split-Path -Path (Split-Path -Path $installer -Parent) -Parent
          $overlapHome = Join-Path $sourceSkillRoot 'overlap-home'
          Assert-Throws `
            -Action { & $installer -CopilotHome $overlapHome -WhatIf } `
            -ExpectedPattern 'source and target skill paths must not overlap' `
            -FailureMessage 'Install unexpectedly accepted a target nested inside the source package.'
          if (Test-Path -LiteralPath $overlapHome) {
            throw 'A rejected overlapping target modified the source package.'
          }

          $installOutput = @(& $installer -CopilotHome $copilotHome)
          if ($installOutput -notcontains 'LUNA_SUBAGENTS_INSTALL_OK') {
            throw 'Installation did not report success.'
          }
          $verifyOutput = @(& $installer -Action Verify -CopilotHome $copilotHome)
          if ($verifyOutput -notcontains 'LUNA_SUBAGENTS_VERIFY_OK') {
            throw 'Verification did not report success.'
          }

          $agent = [IO.File]::ReadAllText($agentPath).Replace("`r`n", "`n").Replace("`r", "`n")
          $frontmatterMatch = [regex]::Match(
            $agent,
            '\A---\n(?<frontmatter>.*?)\n---(?:\n|\z)',
            [Text.RegularExpressions.RegexOptions]::Singleline
          )
          if (-not $frontmatterMatch.Success) {
            throw 'Installed executor does not begin with YAML frontmatter.'
          }
          $frontmatterLines = @($frontmatterMatch.Groups['frontmatter'].Value -split "`n")
          $modelLines = @($frontmatterLines | Where-Object { $_ -match '^\s*model\s*:' })
          $effortLines = @($frontmatterLines | Where-Object { $_ -match '^\s*reasoning-effort\s*:' })
          if ($modelLines.Count -ne 1 -or $modelLines[0] -cne 'model: gpt-5.6-luna') {
            throw 'Installed executor must contain exactly "model: gpt-5.6-luna".'
          }
          if ($effortLines.Count -ne 1 -or $effortLines[0] -cne 'reasoning-effort: max') {
            throw 'Installed executor must contain exactly "reasoning-effort: max".'
          }
          if ($frontmatterLines -match '^\s*(service-tier|service_tier)\s*:') {
            throw 'Installed executor must not configure quota-based service routing.'
          }

          $firstInstructionsHash = (Get-FileHash -LiteralPath $instructionsPath -Algorithm SHA256).Hash
          $repeatOutput = @(& $installer -CopilotHome $copilotHome)
          if ($repeatOutput -notcontains 'LUNA_SUBAGENTS_INSTALL_OK') {
            throw 'Repeated installation did not report success.'
          }
          $secondInstructionsHash = (Get-FileHash -LiteralPath $instructionsPath -Algorithm SHA256).Hash
          if ($firstInstructionsHash -cne $secondInstructionsHash) {
            throw 'Repeated installation changed canonical instructions.'
          }

          $instructions = [IO.File]::ReadAllText($instructionsPath)
          if (-not $instructions.Contains('Keep this line.')) {
            throw 'Installation removed existing instructions.'
          }
          if (([regex]::Matches($instructions, '<!-- BEGIN luna-subagents managed section -->')).Count -ne 1 -or
              ([regex]::Matches($instructions, '<!-- END luna-subagents managed section -->')).Count -ne 1) {
            throw 'Repeated installation did not preserve exactly one managed section.'
          }

          $unexpected = Join-Path $installedSkillRoot 'unexpected.txt'
          [IO.File]::WriteAllText($unexpected, 'unexpected', [Text.UTF8Encoding]::new($false))
          Assert-Throws `
            -Action { & $installer -Action Verify -CopilotHome $copilotHome } `
            -ExpectedPattern 'unexpected installed file' `
            -FailureMessage 'Verify unexpectedly accepted an extra package file.'
          & $installer -CopilotHome $copilotHome | Out-Null
          if (Test-Path -LiteralPath $unexpected) {
            throw 'Reinstall did not remove an extra package file.'
          }

          Add-Content -LiteralPath $installedSkill -Value 'tampered'
          Assert-Throws `
            -Action { & $installer -Action Verify -CopilotHome $copilotHome } `
            -ExpectedPattern 'stale or tampered' `
            -FailureMessage 'Verify unexpectedly accepted a stale or tampered package file.'
          & $installer -CopilotHome $copilotHome | Out-Null
          $sourceSkillHash = (Get-FileHash -LiteralPath $sourceSkill -Algorithm SHA256).Hash
          $installedSkillHash = (Get-FileHash -LiteralPath $installedSkill -Algorithm SHA256).Hash
          if ($sourceSkillHash -cne $installedSkillHash) {
            throw 'Reinstall did not restore a stale or tampered package file.'
          }

          $legacyProfiles = @(
            'luna-subagents-executor.toml',
            'luna-subagents-executor-fast.toml',
            'luna-subagents-executor-standard.toml'
          )
          foreach ($legacyProfile in $legacyProfiles) {
            [IO.File]::WriteAllText(
              (Join-Path $copilotHome "agents\$legacyProfile"),
              'legacy',
              [Text.UTF8Encoding]::new($false)
            )
          }
          & $installer -CopilotHome $copilotHome | Out-Null
          foreach ($legacyProfile in $legacyProfiles) {
            if (Test-Path -LiteralPath (Join-Path $copilotHome "agents\$legacyProfile")) {
              throw "Reinstall did not remove obsolete executor profile: $legacyProfile"
            }
          }

          $linkHome = Join-Path $env:RUNNER_TEMP 'copilot-link-home'
          $externalSkills = Join-Path $env:RUNNER_TEMP 'external-skills'
          New-Item -ItemType Directory -Path $linkHome, $externalSkills -Force | Out-Null
          $skillsLink = Join-Path $linkHome 'skills'
          New-Item -ItemType Junction -Path $skillsLink -Target $externalSkills | Out-Null
          try {
            Assert-Throws `
              -Action { & $installer -CopilotHome $linkHome } `
              -ExpectedPattern 'reparse point' `
              -FailureMessage 'Install unexpectedly followed a managed junction.'
            Assert-Throws `
              -Action { & $installer -Action Verify -CopilotHome $linkHome } `
              -ExpectedPattern 'reparse point' `
              -FailureMessage 'Verify unexpectedly followed a managed junction.'
          }
          finally {
            Remove-Item -LiteralPath $skillsLink -Force
          }
          if (Get-ChildItem -LiteralPath $externalSkills -Force | Select-Object -First 1) {
            throw 'A rejected managed junction modified its target.'
          }

          $externalHome = Join-Path $env:RUNNER_TEMP 'external-home'
          $homeLink = Join-Path $env:RUNNER_TEMP 'copilot-home-link'
          New-Item -ItemType Directory -Path $externalHome -Force | Out-Null
          New-Item -ItemType Junction -Path $homeLink -Target $externalHome | Out-Null
          try {
            Assert-Throws `
              -Action { & $installer -CopilotHome $homeLink } `
              -ExpectedPattern 'Copilot home path must not contain.*reparse point' `
              -FailureMessage 'Install unexpectedly followed a Copilot home junction.'
            Assert-Throws `
              -Action { & $installer -Action Verify -CopilotHome $homeLink } `
              -ExpectedPattern 'Copilot home path must not contain.*reparse point' `
              -FailureMessage 'Verify unexpectedly followed a Copilot home junction.'
          }
          finally {
            Remove-Item -LiteralPath $homeLink -Force
          }
          if (Get-ChildItem -LiteralPath $externalHome -Force | Select-Object -First 1) {
            throw 'A rejected Copilot home junction modified its target.'
          }

          $externalParent = Join-Path $env:RUNNER_TEMP 'external-parent'
          $parentLink = Join-Path $env:RUNNER_TEMP 'copilot-parent-link'
          New-Item -ItemType Directory -Path $externalParent -Force | Out-Null
          New-Item -ItemType Junction -Path $parentLink -Target $externalParent | Out-Null
          $nestedHome = Join-Path $parentLink 'not-created'
          try {
            Assert-Throws `
              -Action { & $installer -CopilotHome $nestedHome } `
              -ExpectedPattern 'Copilot home path must not contain.*reparse point' `
              -FailureMessage 'Install probed through a Copilot home ancestor junction.'
            Assert-Throws `
              -Action { & $installer -Action Verify -CopilotHome $nestedHome } `
              -ExpectedPattern 'Copilot home path must not contain.*reparse point' `
              -FailureMessage 'Verify probed through a Copilot home ancestor junction.'
          }
          finally {
            Remove-Item -LiteralPath $parentLink -Force
          }
          if (Get-ChildItem -LiteralPath $externalParent -Force | Select-Object -First 1) {
            throw 'A rejected Copilot home ancestor junction modified its target.'
          }

          $finalVerifyOutput = @(& $installer -Action Verify -CopilotHome $copilotHome)
          if ($finalVerifyOutput -notcontains 'LUNA_SUBAGENTS_VERIFY_OK') {
            throw 'Final verification did not report success.'
          }

      - name: Install and verify through install.cmd with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-LauncherResult {
            param(
              [Parameter(Mandatory)]
              [object[]]$Output,

              [Parameter(Mandatory)]
              [int]$ExitCode,

              [Parameter(Mandatory)]
              [string]$ExpectedHostMarker,

              [Parameter(Mandatory)]
              [string]$ExpectedEdition,

              [Parameter(Mandatory)]
              [int]$ExpectedMajor,

              [Parameter(Mandatory)]
              [string]$Operation
            )

            if ($ExitCode -ne 0) {
              throw "$Operation through install.cmd failed with exit code $ExitCode. Output: $($Output -join ' | ')"
            }
            if ($Output -notcontains $ExpectedHostMarker) {
              throw "$Operation did not report $ExpectedHostMarker. Output: $($Output -join ' | ')"
            }
            $editionMarker = "LUNA_POWERSHELL_EDITION=$ExpectedEdition"
            if ($Output -notcontains $editionMarker) {
              throw "$Operation did not report $editionMarker. Output: $($Output -join ' | ')"
            }
            $versionLines = @($Output | Where-Object { "$_" -like 'LUNA_POWERSHELL_VERSION=*' })
            if ($versionLines.Count -ne 1) {
              throw "$Operation did not report exactly one PowerShell version. Output: $($Output -join ' | ')"
            }
            $reportedVersion = [version]("$($versionLines[0])".Substring('LUNA_POWERSHELL_VERSION='.Length))
            if ($reportedVersion.Major -ne $ExpectedMajor) {
              throw "$Operation ran with PowerShell $reportedVersion instead of major $ExpectedMajor."
            }
            $expectedMarker = if ($Operation -eq 'Install') {
              'LUNA_SUBAGENTS_INSTALL_OK'
            }
            else {
              'LUNA_SUBAGENTS_VERIFY_OK'
            }
            if ($Output -notcontains $expectedMarker) {
              throw "$Operation did not report $expectedMarker. Output: $($Output -join ' | ')"
            }
          }

          $launcher = Join-Path $PWD 'Skills\luna-subagents\scripts\install.cmd'
          $copilotHomeBase = Join-Path $env:RUNNER_TEMP 'launcher-100%!& (normal home)'
          $launcherHomeArgument = $copilotHomeBase + '\'

          $installOutput = @(& $launcher -CopilotHome $launcherHomeArgument)
          $installExitCode = $LASTEXITCODE
          Assert-LauncherResult `
            -Output $installOutput `
            -ExitCode $installExitCode `
            -ExpectedHostMarker 'LUNA_POWERSHELL_HOST=pwsh' `
            -ExpectedEdition 'Core' `
            -ExpectedMajor 7 `
            -Operation 'Install'

          $verifyOutput = @(& $launcher -Action Verify -CopilotHome $launcherHomeArgument)
          $verifyExitCode = $LASTEXITCODE
          Assert-LauncherResult `
            -Output $verifyOutput `
            -ExitCode $verifyExitCode `
            -ExpectedHostMarker 'LUNA_POWERSHELL_HOST=pwsh' `
            -ExpectedEdition 'Core' `
            -ExpectedMajor 7 `
            -Operation 'Verify'

          if (-not (Test-Path -LiteralPath $copilotHomeBase -PathType Container)) {
            throw 'install.cmd corrupted a Copilot home containing special characters or a trailing backslash.'
          }

          $literalVariableHome = Join-Path $env:RUNNER_TEMP 'launcher-%USERNAME%-literal'
          $literalVariableArgument = (Join-Path $env:RUNNER_TEMP 'launcher-^%USERNAME^%-literal') + '\'
          $literalVariableOutput = @(& $launcher -CopilotHome $literalVariableArgument)
          $literalVariableExitCode = $LASTEXITCODE
          Assert-LauncherResult `
            -Output $literalVariableOutput `
            -ExitCode $literalVariableExitCode `
            -ExpectedHostMarker 'LUNA_POWERSHELL_HOST=pwsh' `
            -ExpectedEdition 'Core' `
            -ExpectedMajor 7 `
            -Operation 'Install'
          if (-not (Test-Path -LiteralPath $literalVariableHome -PathType Container)) {
            throw 'install.cmd re-expanded an escaped literal %USERNAME% in the Copilot home.'
          }
          $expandedVariableHome = $literalVariableHome.Replace('%USERNAME%', $env:USERNAME)
          if ($expandedVariableHome -cne $literalVariableHome -and
              (Test-Path -LiteralPath $expandedVariableHome)) {
            throw 'install.cmd expanded an escaped literal %USERNAME% in the Copilot home.'
          }
          $negativeStdout = Join-Path $env:RUNNER_TEMP 'launcher-negative.stdout.txt'
          $negativeStderr = Join-Path $env:RUNNER_TEMP 'launcher-negative.stderr.txt'
          $previousTestLauncher = $env:LUNA_TEST_LAUNCHER
          try {
            $env:LUNA_TEST_LAUNCHER = $launcher
            $missingValueProcess = Start-Process `
              -FilePath $env:ComSpec `
              -ArgumentList '/d /s /c ""%LUNA_TEST_LAUNCHER%" -CopilotHome -WhatIf -WhatIf"' `
              -RedirectStandardOutput $negativeStdout `
              -RedirectStandardError $negativeStderr `
              -Wait `
              -PassThru `
              -NoNewWindow
            $missingValueExitCode = $missingValueProcess.ExitCode
            $missingValueOutput = @(
              if (Test-Path -LiteralPath $negativeStdout) {
                Get-Content -LiteralPath $negativeStdout
              }
              if (Test-Path -LiteralPath $negativeStderr) {
                Get-Content -LiteralPath $negativeStderr
              }
            )
          }
          finally {
            $env:LUNA_TEST_LAUNCHER = $previousTestLauncher
            Remove-Item -LiteralPath $negativeStdout, $negativeStderr -Force -ErrorAction SilentlyContinue
          }
          if ($missingValueExitCode -eq 0 -or
              ($missingValueOutput -join "`n") -notmatch 'LUNA_ARGUMENT_ERROR: missing value for -CopilotHome') {
            throw "install.cmd did not reject an option-like -CopilotHome value. Output: $($missingValueOutput -join ' | ')"
          }

      - name: Install and verify through install.cmd fallback to Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-LauncherResult {
            param(
              [Parameter(Mandatory)]
              [object[]]$Output,

              [Parameter(Mandatory)]
              [int]$ExitCode,

              [Parameter(Mandatory)]
              [string]$ExpectedHostMarker,

              [Parameter(Mandatory)]
              [string]$ExpectedEdition,

              [Parameter(Mandatory)]
              [int]$ExpectedMajor,

              [Parameter(Mandatory)]
              [string]$Operation
            )

            if ($ExitCode -ne 0) {
              throw "$Operation through install.cmd failed with exit code $ExitCode. Output: $($Output -join ' | ')"
            }
            if ($Output -notcontains $ExpectedHostMarker) {
              throw "$Operation did not report $ExpectedHostMarker. Output: $($Output -join ' | ')"
            }
            $editionMarker = "LUNA_POWERSHELL_EDITION=$ExpectedEdition"
            if ($Output -notcontains $editionMarker) {
              throw "$Operation did not report $editionMarker. Output: $($Output -join ' | ')"
            }
            $versionLines = @($Output | Where-Object { "$_" -like 'LUNA_POWERSHELL_VERSION=*' })
            if ($versionLines.Count -ne 1) {
              throw "$Operation did not report exactly one PowerShell version. Output: $($Output -join ' | ')"
            }
            $reportedVersion = [version]("$($versionLines[0])".Substring('LUNA_POWERSHELL_VERSION='.Length))
            if ($reportedVersion.Major -ne $ExpectedMajor) {
              throw "$Operation ran with PowerShell $reportedVersion instead of major $ExpectedMajor."
            }
            $expectedMarker = if ($Operation -eq 'Install') {
              'LUNA_SUBAGENTS_INSTALL_OK'
            }
            else {
              'LUNA_SUBAGENTS_VERIFY_OK'
            }
            if ($Output -notcontains $expectedMarker) {
              throw "$Operation did not report $expectedMarker. Output: $($Output -join ' | ')"
            }
          }

          $launcher = Join-Path $PWD 'Skills\luna-subagents\scripts\install.cmd'
          $copilotHomeBase = Join-Path $env:RUNNER_TEMP 'fallback-100%!& (home)'
          $launcherHomeArgument = $copilotHomeBase + '\'
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $windowsPowerShellDirectory = Split-Path -Path $windowsPowerShell -Parent
          if (-not (Test-Path -LiteralPath $windowsPowerShell -PathType Leaf)) {
            throw "Windows PowerShell 5.1 was not found at $windowsPowerShell."
          }

          $oldPwshDirectory = Join-Path $env:RUNNER_TEMP 'old-pwsh'
          New-Item -ItemType Directory -Path $oldPwshDirectory -Force | Out-Null
          $oldPwsh = Join-Path $oldPwshDirectory 'pwsh.exe'
          Copy-Item -LiteralPath $windowsPowerShell -Destination $oldPwsh

          $originalPath = $env:Path
          $originalPSModulePath = $env:PSModulePath
          try {
            $env:Path = @(
              $oldPwshDirectory,
              (Join-Path $env:SystemRoot 'System32'),
              $windowsPowerShellDirectory
            ) -join [IO.Path]::PathSeparator
            $env:PSModulePath = Join-Path $env:RUNNER_TEMP 'missing-modules'

            $whereOutput = @(where.exe where.exe 2>$null)
            $whereExitCode = $LASTEXITCODE
            if ($whereExitCode -ne 0 -or $whereOutput.Count -eq 0) {
              throw 'Fallback test removed where.exe from PATH.'
            }
            $pwshOutput = @(where.exe pwsh.exe 2>$null)
            $pwshExitCode = $LASTEXITCODE
            if ($pwshExitCode -ne 0 -or $pwshOutput.Count -ne 1 -or
                -not [string]::Equals($pwshOutput[0], $oldPwsh, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Fallback test did not find only the old pwsh shim: $($pwshOutput -join ' | ')"
            }
            $oldPwshMajor = & $oldPwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.Major'
            if ($LASTEXITCODE -ne 0 -or [int]$oldPwshMajor -ge 7) {
              throw "Fallback test requires a runnable pwsh.exe shim below major 7, received: $oldPwshMajor"
            }
            $windowsPowerShellOutput = @(where.exe powershell.exe 2>$null)
            $windowsPowerShellExitCode = $LASTEXITCODE
            if ($windowsPowerShellExitCode -ne 0 -or $windowsPowerShellOutput.Count -eq 0) {
              throw 'Fallback test removed Windows PowerShell from PATH.'
            }

            $installOutput = @(& $launcher -CopilotHome $launcherHomeArgument)
            $installExitCode = $LASTEXITCODE
            Assert-LauncherResult `
              -Output $installOutput `
              -ExitCode $installExitCode `
              -ExpectedHostMarker 'LUNA_POWERSHELL_HOST=windows-powershell' `
              -ExpectedEdition 'Desktop' `
              -ExpectedMajor 5 `
              -Operation 'Install'

            $verifyOutput = @(& $launcher -Action Verify -CopilotHome $launcherHomeArgument)
            $verifyExitCode = $LASTEXITCODE
            Assert-LauncherResult `
              -Output $verifyOutput `
              -ExitCode $verifyExitCode `
              -ExpectedHostMarker 'LUNA_POWERSHELL_HOST=windows-powershell' `
              -ExpectedEdition 'Desktop' `
              -ExpectedMajor 5 `
              -Operation 'Verify'

            if (-not (Test-Path -LiteralPath $copilotHomeBase -PathType Container)) {
              throw 'Fallback install.cmd corrupted a Copilot home containing special characters or a trailing backslash.'
            }
          }
          finally {
            $env:Path = $originalPath
            $env:PSModulePath = $originalPSModulePath
          }

      - name: Install and verify install.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $PSVersionTable.PSVersion
          if ($version.Major -ne 5 -or $version.Minor -lt 1) {
            throw "Expected Windows PowerShell major 5 and minor at least 1, received $($version.ToString())."
          }

          $installer = Join-Path $PWD 'Skills\luna-subagents\scripts\install.ps1'
          $copilotHome = Join-Path $env:RUNNER_TEMP 'direct Windows PowerShell home'

          $originalPSModulePath = $env:PSModulePath
          $env:PSModulePath = Join-Path $env:RUNNER_TEMP 'missing-direct-modules'
          try {
            $installOutput = @(& $installer -CopilotHome $copilotHome)
            $verifyOutput = @(& $installer -Action Verify -CopilotHome $copilotHome)
          }
          finally {
            $env:PSModulePath = $originalPSModulePath
          }

          if ($installOutput -notcontains 'LUNA_SUBAGENTS_INSTALL_OK') {
            throw "Direct Windows PowerShell install did not report success. Output: $($installOutput -join ' | ')"
          }
          if ($installOutput -notcontains 'LUNA_POWERSHELL_EDITION=Desktop' -or
              $installOutput -notcontains "LUNA_POWERSHELL_VERSION=$($version.ToString())") {
            throw "Direct Windows PowerShell install did not report the actual runtime. Output: $($installOutput -join ' | ')"
          }

          if ($verifyOutput -notcontains 'LUNA_SUBAGENTS_VERIFY_OK') {
            throw "Direct Windows PowerShell verify did not report success. Output: $($verifyOutput -join ' | ')"
          }
          if ($verifyOutput -notcontains 'LUNA_POWERSHELL_EDITION=Desktop' -or
              $verifyOutput -notcontains "LUNA_POWERSHELL_VERSION=$($version.ToString())") {
            throw "Direct Windows PowerShell verify did not report the actual runtime. Output: $($verifyOutput -join ' | ')"
          }
